name: Threshold AI Bug Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: threshold-bug-hunt
  cancel-in-progress: true

jobs:
  hunt:
    name: Safe Threshold Security Research
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout hunter
        uses: actions/checkout@v4

      - name: Clone Threshold tBTC
        run: |
          git clone --depth 500 https://github.com/threshold-network/tbtc-v2.git target

      - name: Record target revision
        run: |
          mkdir -p findings
          cd target
          {
            echo "# Target Revision"
            echo
            echo "Commit:"
            git rev-parse HEAD
            echo
            echo "Recent commits:"
            git log --oneline -30
          } > ../findings/target.txt

      - name: Install analysis tools
        run: |
          python3 -m pip install --user --break-system-packages semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep
        run: |
          mkdir -p findings
          semgrep --config p/smart-contracts --json --output findings/semgrep.json target/solidity || true

      - name: Security surface scan
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Security Surface Scan"
            echo
            echo "Generated: $(date -u)"
            echo
            echo "## Authorization"
            grep -RInE --include="*.sol" 'onlyOwner|onlyBridge|onlyRole|hasRole|msg\.sender|_msgSender' target/solidity 2>/dev/null | head -n 500 || true
            echo
            echo "## External calls"
            grep -RInE --include="*.sol" 'delegatecall|call\{|staticcall|transferFrom|safeTransferFrom' target/solidity 2>/dev/null | head -n 500 || true
            echo
            echo "## Signature / authentication"
            grep -RInE --include="*.sol" 'ecrecover|ECDSA|permit|signature|nonce' target/solidity 2>/dev/null | head -n 500 || true
            echo
            echo "## Accounting"
            grep -RInE --include="*.sol" 'mint|burn|balanceOf|allowance|increaseBalance|decreaseBalance' target/solidity 2>/dev/null | head -n 700 || true
            echo
            echo "## Bridge / cross-chain"
            grep -RInE --include="*.sol" 'Wormhole|Gateway|Bridge|receiveTbtc|sendTbtc|completeTransfer|deposit' target/solidity 2>/dev/null | head -n 700 || true
            echo
            echo "## Time / block dependence"
            grep -RInE --include="*.sol" 'block\.timestamp|block\.number|blockhash' target/solidity 2>/dev/null | head -n 400 || true
            echo
            echo "## Low-level Solidity"
            grep -RInE --include="*.sol" 'assembly|unchecked|selfdestruct' target/solidity 2>/dev/null | head -n 400 || true
          } > findings/security-surface.md

      - name: Historical security analysis
        shell: bash
        run: |
          {
            echo "# Historical Security Analysis"
            echo
            echo "## Security-related commits"
            echo
            cd target
            git log --all --oneline --grep="security\|vulnerability\|exploit\|audit\|critical\|high\|fix\|patch" -i | head -n 300 || true
            echo
            echo "## Recent Solidity changes"
            git log --all --oneline -- solidity/ | head -n 300 || true
          } > ../findings/history.md

      - name: Build known issue filter
        shell: bash
        run: |
          cat > findings/known-issues.md <<'EOF'
          # Known / Excluded Issues
          - Public Threshold security advisories
          - Immunefi known issues
          - Previously reported vulnerabilities
          - Duplicate findings
          - Deprecated contracts
          - Out-of-scope assets
          - Admin-only compromise
          - Best-practice recommendations
          - Scanner warnings without demonstrated impact
          - Mainnet exploitation
          - Public-testnet exploitation
          EOF

      - name: Build candidate index
        shell: bash
        run: |
          {
            echo "# Candidate Index"
            echo
            echo "## Solidity files"
            find target/solidity -type f -name "*.sol" | sort
            echo
            echo "## Value-changing functions"
            grep -RInE --include="*.sol" 'function .*mint|function .*burn|function .*deposit|function .*redeem|function .*withdraw|function .*transfer|function .*approve' target/solidity 2>/dev/null | head -n 1000 || true
          } > findings/candidate-index.md

      - name: Create validation checklist
        shell: bash
        run: |
          cat > findings/BOUNTY_VALIDATION.md <<'EOF'
          # Bounty Validation Checklist
          - [ ] In-scope asset confirmed
          - [ ] Correct code version
          - [ ] Not a known Immunefi issue
          - [ ] Not a public advisory
          - [ ] Concrete attacker path
          - [ ] Reproducible locally
          - [ ] PoC exists
          - [ ] No mainnet exploitation
          - [ ] No public-testnet exploitation
          
          A scanner warning alone is NOT a bounty.
          EOF

      - name: Generate status
        shell: bash
        run: |
          cat > findings/STATUS.md <<'EOF'
          # Threshold AI Bug Hunter - Status
          RESEARCH RUN COMPLETED
          
          Safety:
          - No mainnet exploitation
          - No wallet required
          - No money spent
          - No automatic Immunefi submission
          
          Important: A scanner finding is NOT automatically a bounty.
          EOF

      - name: Create research bundle
        run: tar -czf threshold-research.tar.gz findings

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: threshold-ai-bug-hunt
          path: |
            findings/
            threshold-research.tar.gz
          retention-days: 14

      - name: Write GitHub summary
        run: |
          {
            echo "# Threshold AI Bug Hunter"
            echo "## Research completed"
            echo "Automated source analysis completed."
            echo "## Safety"
            echo "- No mainnet exploitation"
            echo "- No wallet required"
            echo "- No money spent"
            echo "- No automatic bounty submission"
          } >> "$GITHUB_STEP_SUMMARY"
